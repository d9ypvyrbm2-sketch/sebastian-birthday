<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sebastian's guest list</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" />
    <link rel="stylesheet" href="../../party.css" />
  </head>
  <body>
    <main class="family">
      <div class="family-card">
        <p>Different devices that opened the invite</p>
        <p class="family-count" id="devices">...</p>
        <div class="family-totals">
          <div><strong id="coming">...</strong>Coming</div>
          <div><strong id="not-coming">...</strong>Not coming</div>
        </div>
        <h1>Replies</h1>
        <ul id="replies"></ul>
        <p id="empty" hidden>No replies yet.</p>
        <p id="problem" hidden>The list could not be loaded. Refresh the page.</p>
      </div>
    </main>
    <script src="../../store.js"></script>
    <script>
      function when(value) {
        const parsed = new Date(value);
        if (Number.isNaN(parsed.getTime())) return value;
        return new Intl.DateTimeFormat("en-US", {
          timeZone: "America/New_York",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
        }).format(parsed);
      }

      readBook()
        .then((book) => {
          document.getElementById("devices").textContent = String(book.devices.length);
          const coming = book.replies.filter((reply) => reply.coming).length;
          document.getElementById("coming").textContent = String(coming);
          document.getElementById("not-coming").textContent = String(book.replies.length - coming);
          const list = document.getElementById("replies");
          book.replies.slice().reverse().forEach((reply) => {
            const item = document.createElement("li");
            const name = document.createElement("span");
            name.textContent = reply.name + ". " + (reply.coming ? "Coming" : "Not coming");
            const time = document.createElement("time");
            time.dateTime = reply.createdAt;
            time.textContent = when(reply.createdAt);
            item.append(name, time);
            list.append(item);
          });
          document.getElementById("empty").hidden = book.replies.length > 0;
        })
        .catch(() => {
          document.getElementById("problem").hidden = false;
        });
    </script>
  </body>
</html>
